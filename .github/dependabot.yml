version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Gives the ecosystem a week to spot a compromised release before it gets here.
    cooldown:
      default-days: 7
    # "chore(deps): ...", which the changelog lists under Dependencies.
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # "ci(deps): ...", which the changelog leaves out.
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
