# Checks that the commits of a pull request follow the Conventional Commits, as `.commitlintrc.mjs`
# configures commitlint to.
name: Commit messages

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          npm exec --yes \
            --package @commitlint/cli@21.2.4 \
            --package @commitlint/config-conventional@21.2.4 \
            -- commitlint --from "$BASE" --to "$HEAD" --verbose
