# Releases with release-plz (https://release-plz.dev).
#
# - Running this workflow manually opens the release PR, so that its changelog entries can be
#   edited before it's merged. Running it again regenerates the PR, without the edits made to it.
# - Merging the release PR publishes the version that isn't on crates.io yet, tags it and creates
#   its GitHub release. Release PRs are the only ones that change the changelog, so that's what
#   tells the merge apart from other pushes to `main`. Running this workflow manually with the
#   `release` command releases too.
#
# release-plz works on GitHub with the token in the `RELEASE_PLZ_TOKEN` secret, which needs write
# access to the contents and the pull requests of the repository. `GITHUB_TOKEN` won't do, as
# nothing it does triggers workflows: CI wouldn't run on the release PR, nor would the workflows
# that run on tags and releases.
#
# The crate is published with the crates.io token in the `CARGO_REGISTRY_TOKEN` secret or, if
# there's none, through crates.io's trusted publishing. Trusted publishing can only be set up for a
# crate that's on crates.io already, so the first release needs the token.
name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      command:
        description: The release-plz command to run
        type: choice
        options: [release-pr, release]
        default: release-pr

permissions: {}

jobs:
  release:
    if: >-
      github.repository == 'trifectatechfoundation/allowd' &&
      (github.event_name == 'push' ||
      (inputs.command == 'release' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For crates.io's trusted publishing.
      id-token: write
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - &check-token
        name: Check the token
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$GIT_TOKEN" ]; then
            echo "::error::The RELEASE_PLZ_TOKEN secret isn't set."
            exit 1
          fi
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &release-plz
        name: Install release-plz
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: release-plz
      - name: Release
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Even set to an empty string, `CARGO_REGISTRY_TOKEN` rules out trusted publishing.
          if [ -n "$CRATES_IO_TOKEN" ]; then
            export CARGO_REGISTRY_TOKEN="$CRATES_IO_TOKEN"
          fi
          release-plz release

  release-pr:
    if: >-
      github.repository == 'trifectatechfoundation/allowd' && inputs.command == 'release-pr' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - *check-token
      - *checkout
      - *release-plz
      - name: Open the release PR
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: release-plz release-pr
